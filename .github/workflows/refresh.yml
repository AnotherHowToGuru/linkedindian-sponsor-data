name: Refresh Sponsor Register Data

# Runs once a day. The Home Office updates the real register roughly
# weekly to a few times a month, with occasional same-day revocations,
# so daily keeps this current without hammering GOV.UK unnecessarily.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and process register
        run: python fetch_and_process.py

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sponsors.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh sponsor register data"
            git push
          fi
